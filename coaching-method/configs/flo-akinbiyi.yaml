  layer1: "The host asks <em>&ldquo;Tell me about some memorable moments when it comes to stage presence.&rdquo;</em> In the very next turn, Flo responds. These exact lines are the evidence for everything that follows."
  meaning: "The host asks about stage presence. Flo doesn’t give a tip or a definition. He tells a story about a moment he created for an audience."
  cue: "Asked about memorable moments, Flo answers, <em>&ldquo;So here’s a story. I was doing a workshop in Algeria…&rdquo;</em>"
  layer2: "Flo answers with a story, not a rule. A CFO wanted better than average presentations, so Flo created a moment the team would never forget. The response stays linked to the exact exchange."
  layer3: "A team presents, but nobody remembers it. In Flo’s material this shows up as <em>presenting on stage</em>."
  layer4: "Flo comes back to this again and again in his posts and talks: how to engage an audience and leave a lasting impression."
  layer5: "The purpose is to move from &ldquo;an average presentation&rdquo; to &ldquo;a moment they remember&rdquo;."
  layer6: "<em>People won’t remember every word, but they’ll remember how you made them feel.</em> This is the principle behind Flo’s story."

