steps:
  collect: "We read {linkedin} of his LinkedIn posts, {youtube} of his YouTube videos, including his TEDx talk and Web Summit talk, and {web} pages from his website: <em>{words} words across {lines} lines.</em> In interviews we only use Flo’s own lines, never the host’s views as his. From this collection, we follow listener questions on Dubai Eye 103.8 radio, where Flo answers people who struggle with nerves."
  layer1: "A listener, Priya, writes in: <em>&ldquo;Inside I feel quite confident but it’s like my body betrays me.&rdquo;</em> She blushes, shakes, and wants a job that involves public speaking. In the very next turn, Flo responds. These exact lines are the evidence for everything that follows."
  meaning: "Priya isn’t asking what to say. She’s asking how to stop her body giving her away. Flo doesn’t tell her to calm down or push through."
  cue: "Asked how to deal with the blushing and shaking, Flo answers, <em>&ldquo;So first of all, Flo also gets nervous.&rdquo;</em>"
  layer2: "Flo starts with his own nerves, then gives practical fixes for her body: broad gestures instead of clasped hands, no sheet of paper to shake, and breathing. The response stays linked to the exact exchange."
  layer3: "Someone who knows their stuff, but whose body betrays them under pressure. In Flo’s material this shows up as <em>stage fright</em>."
  layer4: "Flo comes back to stage fright again and again, in his posts, his website and videos like <em>Three techniques to combat stage fright</em>: understand what happens with your body, then develop a protocol."
  layer5: "The purpose is to move from &ldquo;my body betrays me&rdquo; to &ldquo;I know what works for me&rdquo;, a protocol you can rely on before and on stage."
  layer6: "<em>Stage fright isn’t a sign that you’re not ready - it’s a sign that you care.</em> This is the principle behind Flo’s answer."

