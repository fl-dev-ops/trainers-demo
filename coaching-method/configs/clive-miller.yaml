steps:
  collect: "We read {youtube} of his YouTube videos, including his own short courses and guest podcasts, and {linkedin} of his LinkedIn posts: <em>{words} words across {lines} lines.</em> From this collection, we follow one podcast, where the host asks how his training helps with a complex sale."
  transcript: ["A recording becomes text", "The podcast is transcribed word for word. At first, it is simply a record of who said what."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Clive answered the host."]
  speakers: ["Who said what", "We separate the host’s questions from Clive’s answers, and mark the question she brings him."]
  layer1: "The host asks: <em>&ldquo;How does your training help your client, either speed up the process or prevent some bad results happening?&rdquo;</em> Clive’s answer comes straight after. These exact lines are the evidence for everything that follows."
  meaning: "The host wants to know how his training makes a long, complex sale go better. Clive doesn’t talk about presenting or closing: he says the usual order is the wrong way round, and gives her a method."
  cue: "Asked how his training helps, Clive answers, <em>&ldquo;I teach something called CLEAR &hellip; and the requirement is always on the back end.&rdquo;</em>"
  layer2: "He turns the question into a different order of work: facts first, solution last. The response stays linked to the exact moment."
  layer3: "A salesperson pitches early, the customer asks for it in writing, and then stops taking calls. In Clive’s material this shows up as <em>a deal that loses momentum</em>."
  layer4: "Clive keeps coming back to CLEAR, which comes up in 7 of his sources, with its three rules in 2, across his talks, interviews and posts."
  layer5: "The purpose is to move salespeople from &ldquo;pitch, then wait for an answer&rdquo; to &ldquo;get the facts first, then earn the proposal&rdquo;."
  layer6: "<em>As soon as you talk about the solution, you&rsquo;ve given up the only reason they have for talking to you.</em> This is the principle behind Clive’s answer."

cards:
  layer1:
    cue: How does your training help your client, you know, either speed up the process or prevent some &hellip; bad results happening?
    move: I teach something called CLEAR which is Circumstances, Leverage, Expand, Advantage, Requirement. And the requirement is always on the back end &hellip; don&rsquo;t talk about the solution, because as soon as you talk about the solution you&rsquo;ve given up the only reason they have for talking to you.
    foot: Two exact lines &middot; two speakers &middot; back to back
  layer2:
    cue: Asks how his training helps with a complex sale
    move: Turns it into facts first, solution last
  layer3:
    title: The deal that loses momentum
    text: The customer liked the pitch and asked for something in writing. Now the calls go unanswered.
    foot: Situation in {his} material &middot; &ldquo;lost momentum&rdquo; in 10 sources
  layer4:
    title: Use CLEAR
    text: Clive keeps coming back to one order of work, so find out Circumstances, Leverage, Expand and Advantage before the Requirement.
    foot: Recurring pattern &middot; CLEAR in 7 sources, the three rules in 2
  layer5:
    title: Get the facts, then earn the proposal
    text: Find out whether the need is real, who is affected and what the numbers are, while you still have a proposal to trade.
    starts: '&ldquo;Pitch, then wait for an answer&rdquo;'
    moves_to: '&ldquo;Facts first, then the proposal&rdquo;'
  layer6:
    quote: As soon as you talk about the solution, you’ve given up the only reason they have for talking to you.
    text: 'The same idea runs through his work: <em>&ldquo;You must get all the information out before you give up talking about the requirement.&rdquo;</em>'

