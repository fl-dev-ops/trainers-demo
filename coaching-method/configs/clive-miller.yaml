# Clive Miller. Build with:
#   python build.py build clive-miller
# Source: lore users/clive-miller: 13 YouTube transcripts (his channel plus 3 guest podcasts), 18 LinkedIn posts. No website
# pages (salessense.co.uk blocks automated fetching).
# Exchange: The Adaptive Edge Podcast EP 04 (2026-09-22, youtube.com/watch?v=1iOOg8LKuvU), host Julia Feng, an old
# friend who once hosted his enterprise-selling training in Shanghai and Beijing. At 12:47 she asks how his training helps a
# client speed up the process or prevent bad results. At 13:03 Clive answers by introducing CLEAR (Circumstances,
# Leverage, Expand, Advantage, Requirement) and its three rules; then the black hole. Chosen by Lalith over the
# Consulting Rainmakers interview. Pronouns he/him/his.

