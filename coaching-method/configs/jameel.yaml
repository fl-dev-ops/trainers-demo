    cue: Tell me about a time when you had to organize and plan a task or a project.
    move: The best way to answer this question is to use a tried and tested STAR model &hellip; because this is a very behavioral question, the STAR model is the best way to answer it.
    foot: Two exact lines &middot; one speaker &middot; back to back
  layer2:
    cue: Raises a behavioural question about planning
    move: Answers with a structure of situation, task, action and result
  layer3:
    title: The behavioural question
    text: The recruiter wants to see how the candidate thinks as a planner, not just what tools they know.
    foot: Situation in {his} material &middot; &ldquo;answering behavioural interview questions&rdquo;
  layer4:
    title: Structure your story
    text: Jameel keeps giving candidates a structure for their experience, from STAR answers to a resume that shows results.
    foot: Recurring pattern &middot; STAR in 35 sources, resume in 130
  layer5:
    title: Turn experience into a STAR story
    text: Pick a real project, then tell it as situation, task, action and result, so the recruiter sees how you plan.
    starts: '&ldquo;I’m good at planning&rdquo;'
    moves_to: '&ldquo;Here’s a time I planned a project, and the result&rdquo;'
  layer6:
    quote: The STAR model is the best way to answer it.
    text: 'The same idea runs through his work: <em>&ldquo;There is no parallel to experience in supply chain.&rdquo;</em>'

