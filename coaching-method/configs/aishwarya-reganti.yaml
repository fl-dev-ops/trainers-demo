    foot: Two exact lines &middot; back to back in the conversation
  layer2:
    cue: Asks whether multi-agent systems are common
    move: Separates swarms from what enterprises actually run
  layer3:
    title: Adopting agents in a company
    text: A team wants to use agents in production and has heard that swarms of agents are the way to do it.
    foot: Situation in {his} material &middot; &ldquo;enterprise agentic AI adoption&rdquo; in 5 sources
  layer4:
    title: Orchestrate, don't swarm
    text: Aishwarya keeps steering builders to one main agent with sub-agents that get a narrow task, finish it and report back.
    foot: Recurring pattern &middot; multi-agent in 18 sources, sub-agents in 17
  layer5:
    title: One agent before many
    text: Start with a single agent. Add sub-agents for narrow, parallel tasks, and keep the system easy to audit.
    starts: '&ldquo;More agents is better&rdquo;'
    moves_to: '&ldquo;Start with one, add only what you can explain&rdquo;'
  layer6:
    quote: As a practitioner I would always start with a single agent and build for some form of interoperability.
    text: 'The same idea runs through her work: <em>&ldquo;Multi agent systems are not like microservices. You don&rsquo;t build tons of them just for the heck of it.&rdquo;</em>'

