# Tony Latimer. Build with:
#   python build.py build tony-latimer
# Source: lore users/tony-latimer: 14 YouTube videos (coaching demonstrations, ICF talks, teleclasses), 500 LinkedIn posts,
# 49 Instagram posts, 45 pages from profitableleadership.com.
# Exchange: a real coaching demonstration, "Coaching a breakthrough corporate decision" (Moore Master Coaching teleclass,
# recorded October 2021, youtube.com/watch?v=IICwktf7a_A). The client (Ellie, 25 years in logistics) is torn between
# resigning now to start an art business and waiting two years. After hearing the dilemma, Tony asks:
# "So I hear the decision you're trying to make. What exactly is your problem?", and the real problem surfaces:
# "I don't want to wait 2 years... I want to be free". Pronouns he/him: the host introduces him ("introduce him to you").

coach:
  slug: tony-latimer
  name: Tony
  full_name: Tony Latimer
  pronouns: [he, him, his]

mobile: true

session:
  file: youtube/video/2024-04-18-coaching-a-breakthrough-corporate-decision-IICwktf7a_A.md
  kind: YouTube · live coaching demonstration
  start: So you said just no I cant do it
  coach_speaker: speaker_3
  other: Client
  other_role: Client
  cue: 5
  move: 6
  frames:
    - ["question", "asking what she is afraid of"]
    - ["statement", "naming her fears: running out of money and making a mistake"]
    - ["question", "noticing she is trying to make a decision, and asking what the decision is"]
    - ["statement", "framing it as a choice: wait two years in her job, or resign now with no plan"]
    - ["acknowledgment", "playing back both options in her own terms"]
    - ["statement", "saying she sees a bright future in two years, then asking whether she can wait that long"]
    - ["question", "asking what exactly her problem is"]
    - ["question", "checking what he means"]
    - ["question", "repeating: your problem"]
    - ["statement", "naming the real problem: she doesn't want to wait two years, because she doesn't feel free"]

