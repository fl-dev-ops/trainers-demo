  - {title: Leadership is a state of being, text: 'Leadership is a state of being. Manager is the Role. Leadership is the Style.', phases: [5, 2]}
  - {title: Change yourself first, text: 'You cannot change anyone, except yourself. Yet when you change yourself, others change.', phases: [5, 1]}
