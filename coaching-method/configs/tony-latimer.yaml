steps:
  collect: "We read {youtube} of his YouTube videos, including live coaching demonstrations, {linkedin} of his LinkedIn posts, {instagram} Instagram posts and {web} pages from his website: <em>{words} words across {lines} lines.</em> From this collection, we follow one live coaching session, where a client brings him a decision she can’t make."
  transcript: ["A recording becomes text", "The session is transcribed word for word. At first, it is simply a record of who said what."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Tony asked his question."]
  speakers: ["Who said what", "We separate the client’s words from Tony’s questions, and mark the moment she lays out her dilemma."]
  layer1: "The client lays out her dilemma and ends: <em>&ldquo;So it’s basically, can I wait 2 years feeling dying?&rdquo;</em> Tony’s question comes straight after. These exact lines are the evidence for everything that follows."
  meaning: "She has explained the decision in detail: wait two years, or resign now. Tony doesn’t help her weigh the options. He asks what the problem actually is, and the real issue comes out: she doesn’t feel free."
  cue: "After hearing the dilemma, Tony asks, <em>&ldquo;So I hear the decision you’re trying to make. What exactly is your problem?&rdquo;</em>"
  layer2: "He separates the decision from the problem behind it, and lets the client find it herself. The response stays linked to the exact moment."
  layer3: "A senior professional is torn between staying in a safe career and leaving for something new. In Tony’s material this shows up as <em>career transition</em>."
  layer4: "Tony keeps coming back to coaching mastery and clarity: the Simplicity of Mastery programme comes up in 91 of his sources, and clarity in 34."
  layer5: "The purpose is to move a client from &ldquo;which option should I pick?&rdquo; to &ldquo;this is what’s really in my way&rdquo;."
  layer6: "<em>Coaching is the process of making people think.</em> This is the principle behind Tony’s question."

cards:
  layer1:
    cue: So it’s basically, can I wait 2 years feeling dying?
    move: So I hear the decision you’re trying to make. What exactly is your problem?
    foot: Two exact lines &middot; two speakers &middot; back to back
  layer2:
    cue: Lays out a decision she can’t make
    move: Asks what exactly the problem is, so she names it herself
  layer3:
    title: Stay or go
    text: A safe, well-paid career on one side, something she really wants on the other, and fear of getting it wrong.
    foot: Situation in {his} material &middot; &ldquo;career transition&rdquo;
  layer4:
    title: Clarity before options
    text: Tony keeps getting to absolute clarity on where the person is now before anyone talks about what to do.
    foot: Recurring pattern &middot; clarity in 34 sources
  layer5:
    title: Find the real problem
    text: Separate the decision from the problem behind it, and let the client say it in their own words.
    starts: '&ldquo;Should I wait or resign?&rdquo;'
    moves_to: '&ldquo;I don’t want to wait. I want to be free.&rdquo;'
  layer6:
    quote: Coaching is the process of making people think.
    text: 'The same idea runs through his work: <em>&ldquo;You cannot change anyone, except yourself. Yet when you change yourself, others change.&rdquo;</em>'

