  trace: ["One reply becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Natalie answered her client."]
  speakers: ["Who said what", "We separate Natalie’s lines from the client’s, and mark the line she responds to."]
  layer1: "Natalie asks: <em>&ldquo;How would your manager describe your leadership?&rdquo;</em> The client answers: <em>&ldquo;I’m not sure he even knows I’m doing any of it.&rdquo;</em> These exact lines are the evidence for everything that follows."
  meaning: "The client has mentored junior staff for years, with steady praise and strong relationships, yet she was passed over for a high-profile project. Natalie doesn’t tell her to work harder: she names the real problem."
  cue: "Told that her manager may not even know, Natalie answers, <em>&ldquo;We needed to make the invisible visible.&rdquo;</em>"
  layer2: "She turns a stuck feeling into a plan. The response stays linked to the exact moment."
  layer3: "A reliable high performer is praised, then passed over. In Natalie’s material this shows up as <em>being passed over for a promotion</em>."
  layer4: "Natalie keeps coming back to being seen: visibility comes up in 112 of her sources and promotion in 130, across her posts, videos and website."
  layer5: "The purpose is to move professionals from &ldquo;do great work and wait&rdquo; to &ldquo;make the work seen, then ask&rdquo;."
  layer6: "<em>We needed to make the invisible visible.</em> This is the principle behind Natalie’s reply."

