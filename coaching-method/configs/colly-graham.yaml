steps:
  collect: "We read {youtube} of his videos and interviews, {linkedin} of his LinkedIn posts and {web} pages from his websites: <em>{words} words across {lines} lines.</em> From this collection, we follow one interview. Colly tells the case of a client whose buyers love the product, and shows what he did about it."
  transcript: ["A recording becomes text", "The interview is transcribed word for word. At first, it is simply a record of what was said."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the moment Colly answered his client's problem."]
  speakers: ["Who said what", "Colly tells this case in one long answer, so every line is his. We mark the client's problem as he reports it, and the moment he works out what it costs."]
  layer1: "His client's problem, in his words: <em>&ldquo;The people they spoke to, they love the app, but it&rsquo;s not closing.&rdquo;</em> A few lines later, Colly works out what the problem costs the buyer. These exact lines are the evidence for everything that follows."
  meaning: "The salespeople think the buyer needs more reasons to like the app. Colly doesn&rsquo;t add reasons. He finds the person who signs, turns lost paperwork into pounds, puts it next to the price, and stops talking."
  cue: "Asked why a product everyone loves isn&rsquo;t closing, Colly answers, <em>&ldquo;What you&rsquo;ve got to work out is what is it costing the company?&rdquo;</em>"
  layer2: "He turns a stalled sale into a sum: what the problem costs each week against what the product costs each month. The response stays linked to the exact moment."
  layer3: "The buyers like the product, but nobody signs. In Colly&rsquo;s material this shows up as <em>a buyer who agrees but the deal stalls</em>."
  layer4: "Colly keeps coming back to putting a cost on the problem and talking to the person who decides: the cost of the problem comes up in 9 of the sources in his own words, and finding who signs or controls the budget in 6."
  layer5: "The purpose is to move salespeople from &ldquo;they love it, so why won&rsquo;t they buy?&rdquo; to &ldquo;I know what the problem costs them, and so does the person who signs&rdquo;."
  layer6: "<em>When the cost of doing nothing becomes larger than the cost of acting, budget has a way of appearing.</em> This is the principle behind Colly&rsquo;s answer."

cards:
  layer1:
    cue: "The people they spoke to, they love the app, but it’s not closing."
    move: "What you’ve got to work out is what is it costing the company? &hellip; So, okay, so this is costing you £400 a week and we are asking you to invest £200 a month, and then you just keep quiet."
    foot: Two exact lines &middot; one speaker &middot; one answer
  layer2:
    cue: Hears that buyers love the product, but it isn't closing
    move: Works out what the problem costs, puts it next to the price, then keeps quiet
  layer3:
    title: Loved, but not bought
    text: The users like the product, but the person who signs the cheque hasn't heard why it matters to the business.
    foot: Situation in {his} material &middot; a buyer who agrees but the deal stalls
  layer4:
    title: Cost first, then the person who decides
    text: Colly keeps coming back to what a problem is costing the buyer, and to selling to the person who signs.
    foot: Recurring pattern &middot; the cost of the problem in 9 sources, who decides in 6
  layer5:
    title: Make the cost visible
    text: Talk to the person who signs, turn the problem into money, put it next to the price, and let the number do the work.
    starts: '&ldquo;They love it, so why won&rsquo;t they buy?&rdquo;'
    moves_to: '&ldquo;I know what the problem costs them&rdquo;'
  layer6:
    quote: When the cost of doing nothing becomes larger than the cost of acting, budget has a way of appearing.
    text: 'The same idea runs through his interview: <em>&ldquo;Lost paperwork doesn&rsquo;t mean anything. What&rsquo;s lost paperwork costing you?&rdquo;</em>'

