  layer1: "The host asks: <em>&ldquo;What sets real seasoned professionals apart from the rest?&rdquo;</em> Shelley&rsquo;s answer comes straight after. These exact lines are the evidence for everything that follows."
  meaning: "The host expects a list of skills. Shelley says it is a broad question, names the framework she uses, and says closing skills are not the whole answer."
  cue: "Asked what sets professionals apart, Shelley answers, <em>&ldquo;We have a framework that we use &hellip; clarity, conviction and competency.&rdquo;</em>"
  layer2: "She turns a question about skills into a framework of three parts, and then into a habit of checking your own data. The response stays linked to the exact moment."
  layer3: "A seller wants to know what sets top performers apart, and assumes the answer is better closing skills. In Shelley’s material this shows up as <em>a seller who thinks closing skills are what set top performers apart</em>."
  layer4: "Shelley keeps coming back to confidence built on three things. Clarity, conviction and competency appear in 3 of her sources, from 2022 to 2025, and the habit of finding the weak stage in your process comes back in 2026."
  layer5: "The purpose is to move sellers from &ldquo;what do I need to close more deals?&rdquo; to &ldquo;I know exactly where my process is weakest&rdquo;."
  layer6: "<em>You don&rsquo;t make a sale, you build a sale.</em> This is the principle behind Shelley&rsquo;s answer."

cards:
  layer1:
    cue: "Give me a couple of attributes, skills, actions: what it is that sets real seasoned professionals apart from the rest?"
    move: "So Maria, it’s a broad question, but I’m going to answer it this way. We have a framework that we use &hellip; we don’t make a sale, you build a sale &hellip; the one is we’ve got to have absolute clarity &hellip; the second is conviction &hellip; and the final one is competency."
    foot: Two exact lines &middot; two speakers &middot; back to back
  layer2:
    cue: Asks what sets seasoned sales professionals apart
    move: Names a framework of three parts, not a list of skills
  layer3:
    title: Closing skills versus confidence
    text: The seller assumes the answer is better closing. Shelley says that is only one part of it.
    foot: Situation in {his} material &middot; from this podcast
  layer4:
    title: Build confidence on three things
    text: Shelley keeps coming back to clarity, conviction and competency, and to finding your weak spot in your own numbers.
    foot: Recurring pattern &middot; the 3 Cs in 3 sources, 2022 to 2025
  layer5:
    title: Know exactly where you are weakest
    text: Stop chasing closing tricks. Look at your own conversions, find where deals fall through, and work on that.
    starts: '&ldquo;What do I need to close more deals?&rdquo;'
    moves_to: '&ldquo;I know where my process is weakest, and I&rsquo;m working on it&rdquo;'
  layer6:
    quote: You don’t make a sale, you build a sale.
    text: 'The same idea runs through her work: <em>&ldquo;Your sales manager should never tell you something about your weaknesses that you don&rsquo;t know.&rdquo;</em>'

