    cue: "What is the relevance of all this and why should we do this"
    move: "Here is my answer to them &hellip; shastras are useful to a human being in all walks of life"
    foot: "Two exact lines &middot; one speaker &middot; back to back"
  layer2:
    cue: "Repeats his students’ doubt about the shastras"
    move: "Answers with examples, starting with the intellect"
  layer3:
    title: "Why study the old texts?"
    text: "Students who excel at science want to know what the shastras can still give them."
    foot: "Situation in {his} talk &middot; &ldquo;students ask why study the shastras&rdquo;"
  layer4:
    title: "Indian knowledge systems"
    text: "Prathosh keeps returning to the shastras in today’s context: in his talks, his posts and the chanting tools he builds."
    foot: "Recurring topic &middot; Indian knowledge systems"
  layer5:
    title: "Show what the shastras do for the mind"
    text: "Get students to see the shastras as training in how to think, not as old texts to admire."
    starts: "&ldquo;What is the relevance of all this?&rdquo;"
    moves_to: "&ldquo;This teaches me how to learn&rdquo;"
  layer6:
    quote: "Shastras make you learn how to learn."
    text: "The same idea runs through his posts: <em>&ldquo;one of humanity’s oldest knowledge traditions deserves modern, open infrastructure.&rdquo;</em>"

