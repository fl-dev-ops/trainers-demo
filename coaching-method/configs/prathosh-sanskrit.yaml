# Prathosh A P, Sanskrit teacher persona. Build with:
#   python build.py --users <lore>/users build prathosh-sanskrit
#
# The second of Prathosh's two pages (Lalith, 11 Nov 2026); the ML professor page is configs/prathosh.yaml.
# Reads users/prathosh, kept to his Sanskrit material: 81 chanted recitations (Mahabharata Tatparya Nirnaya 32,
# Srimad Bhagavatam 31, Bhagavad Gita 18), his English talk on the relevance of the shastras, and 22 LinkedIn posts on
# Sanskrit, the shastras and the chanting tools he builds. Keep the include list identical to the exclude list in prathosh.yaml.
# No dialogue exists on this side, so the page follows a monologue (session.segments): in the talk
# (youtube.com/watch?v=Sw_ELnmgqQw, ~8:00) he repeats his IIT and IISc students' question, "what is the relevance of
# all this", and answers it. The talk was given at a Sangh event (Mohan Bhagwat speaks after him); the page quotes only
# Prathosh's own lines.

