steps:
  collect: "We read {youtube} of his videos, including seven online classes on Vishnu Tattva Vinirnaya, four talks and a podcast on the shastras, and 81 chanted recitations, plus {linkedin} of his LinkedIn posts on Sanskrit and the shastras: <em>{words} words across {lines} lines.</em> From this collection, we follow one moment from a class, when a student asks him a question."
  layer1: "A student asks: <em>&ldquo;How do we know this? Why can’t we just say that we are uttering a varna?&rdquo;</em> In the very next turn, Prathosh responds. These exact lines are the evidence for everything that follows."
  meaning: "Prathosh has just separated dhvani, the sound you hear, from varna, the letter it carries. The student wants to drop the extra idea. Prathosh doesn’t repeat the definition. He sends the class to their own experience."
  cue: "Prathosh answers, <em>&ldquo;That’s a very good question &hellip; it’s a matter of our experience that a lot of times we perceive dhvani but not varna.&rdquo;</em>"
  layer2: "He welcomes the doubt, gives an everyday example of a voice calling from far away, then asks the class why it happens. The response stays linked to the exact exchange."
  layer3: "A student pushes back on a definition and asks how we know. It happens again and again in his classes: Prathosh calls it <em>a very good question</em> 15 times across his classes and talks."
  layer4: "Across his classes and talks, Prathosh keeps coming back to <em>how we know what we know</em>: perception, evidence (pramana), and when knowledge can be trusted (pramanya)."
  layer5: ["Layer 5 · The teaching purpose", "The purpose is to move the student from &ldquo;why not just say it?&rdquo; to &ldquo;I can see it in my own experience&rdquo;."]
  layer6: "<em>Shastras make you learn how to learn.</em> This is the principle behind Prathosh’s answer."

cards:
  layer1:
    cue: "How do we know this? Why can’t we just say that we are uttering a varna?"
    move: "That’s a very good question &hellip; it’s a matter of our experience that a lot of times we perceive dhvani but not varna"
    foot: "Two exact lines &middot; two speakers &middot; consecutive turns"
  layer2:
    cue: "Asks why the sound and the letter must be told apart"
    move: "Calls it a very good question, then answers from experience"
  layer3:
    title: "A student asks how we know"
    text: "When a definition looks like one idea too many, students ask him to justify it."
    foot: "Situation in {his} classes &middot; &ldquo;a very good question&rdquo; 15 times"
  layer4:
    title: "How we know what we know"
    text: "Prathosh keeps returning to epistemology: perception, evidence, and when knowledge can be trusted."
    foot: "Recurring topic &middot; epistemology in 8 passages, apaurusheyatva in 7, pramanya in 5"
  layer5:
    title: "Answer from the student’s own experience"
    text: "Turn a definition into something the student can check, not something to accept."
    starts: "&ldquo;Why can’t we just say varna?&rdquo;"
    moves_to: "&ldquo;I can hear it in my own experience&rdquo;"
  layer6:
    quote: "Shastras make you learn how to learn."
    text: "He says the same about how the shastras are taught: <em>&ldquo;In shastric learning asking question is extremely incentivized.&rdquo;</em>"

