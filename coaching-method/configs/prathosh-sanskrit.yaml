# Prathosh A P, Sanskrit teacher persona. Build with:
#   python build.py --users <lore>/users build prathosh-sanskrit
#
# The second of Prathosh's two pages (Lalith, 11 Nov 2026); the ML professor page is configs/prathosh.yaml.
# Reads users/prathosh, kept to his Sanskrit and shastra material (93 videos, 22 posts): his 7 online classes
# "Intro to Vishnu Tattva Vinirnaya" (Nov 2022 - Jan 2023, students ask questions on Zoom), 4 talks on the shastras,
# the Uttaradimath "Exploring Vedanta" podcast, 81 chanted recitations (Mahabharata Tatparya Nirnaya 32,
# Srimad Bhagavatam 31, Bhagavad Gita 18) and 22 LinkedIn posts on Sanskrit, the shastras and his chanting tools.
# Keep the include list identical to the exclude list in prathosh.yaml.
# The page follows a real class exchange (VTVN class of 27 Nov 2022, youtube.com/watch?v=VpPbmb8k19A): a student asks
# why we can't just say we utter a varna; Prathosh calls it a very good question and answers from everyday experience
# (a voice calling from far away: you hear the dhvani but not the varna). The transcript writes the student's "varna"
# in Devanagari, so build.py warns that the layer-1 cue isn't word for word; it is a transliteration.

