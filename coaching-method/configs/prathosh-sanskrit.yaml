steps:
  collect: "We read {youtube} of his videos, most of them chanted recitations of the Mahabharata Tatparya Nirnaya, the Srimad Bhagavatam and the Bhagavad Gita, and {linkedin} of his LinkedIn posts on Sanskrit and the shastras: <em>{words} words across {lines} lines.</em> From this collection, we follow one talk. Prathosh speaks alone here, so he puts his students’ question into words himself, and then answers it."
  transcript: ["A recording becomes text", "His talk is transcribed word for word. At first, it is simply a record of what he said."]
  speakers: ["Who said what", "This is a talk, so every line is Prathosh’s. We mark the moment he puts his students’ question into words, and the moment he answers it."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Prathosh answered his students’ question."]
  layer1: "Prathosh repeats what his IIT and IISc students ask him: <em>&ldquo;what is the relevance of all this and why should we do this.&rdquo;</em> In the very next line, he answers it. These exact lines are the evidence for everything that follows."
  meaning: "His students are JEE toppers who have just found out he studied Sanskrit and the shastras. Prathosh doesn’t defend the tradition in general terms. He promises three examples, starting with what the shastras do for the mind."
  cue: "Asked what the relevance is, Prathosh answers, <em>&ldquo;shastras are useful to a human being in all walks of life.&rdquo;</em>"
  layer2: "He turns a doubt into evidence: Nyaya shastra sharpens the intellect, and an idea behind today’s transformers already sits in a shastra. The response stays linked to the exact moment."
  layer3: "A student who excels at science asks why the old texts matter. Prathosh names this situation himself in the talk: <em>students asking why they should study the shastras</em>."
  layer4: "Across his talks and posts, Prathosh keeps coming back to <em>Indian knowledge systems</em>: how to place the shastras in today’s world, and how to keep them alive with modern tools."
  layer5: ["Layer 5 · The teaching purpose", "The purpose is to move the student from &ldquo;why study this at all?&rdquo; to &ldquo;this teaches me how to think&rdquo;."]
  layer6: "<em>Shastras make you learn how to learn.</em> This is the principle behind Prathosh’s answer."

cards:
