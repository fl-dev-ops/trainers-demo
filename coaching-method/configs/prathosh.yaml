steps:
  collect: "We read {linkedin} of his LinkedIn posts, 22 YouTube videos (his Deep Generative Models course and talks) and 89 lectures and tutorials from his NPTEL course, Mathematical Foundations of Machine Learning: <em>{words} words across {lines} lines.</em> From this collection, we follow one moment from his Deep Generative Models lecture on VAEs, when a student asks him a question."
  layer1: "A student checks what Prathosh meant: <em>&ldquo;so basically we are trying to classify the class of the images.&rdquo;</em> In the very next turn, Prathosh responds. These exact lines are the evidence for everything that follows."
  meaning: "The student narrows the idea down to one use case, to be sure they've got it. Prathosh doesn't just say yes. He widens the idea out, then hands back a better question."
  cue: "Prathosh answers, <em>&ldquo;Anything. So it doesn't matter&hellip; a more interesting question is what advantage do you get by using Z instead of X?&rdquo;</em>"
  layer2: "Prathosh confirms it works for any kind of data, then turns the question round: not what Z can be used for, but why it would be better. The response stays linked to the exact exchange."
  layer3: "A student wants one concrete case to hold on to. In Prathosh's material this shows up as <em>a student asking for concrete examples</em>."
  layer4: "Across his lectures and posts, Prathosh keeps coming back to <em>representation learning</em>: what a model's latent space captures, and why it can be more useful than the raw data."
  layer5: ["Layer 5 · The teaching purpose", "The purpose is to move the student from &ldquo;what does it do?&rdquo; to &ldquo;why does it work?&rdquo;"]
  layer6: "<em>The why behind the how.</em> This is the principle behind Prathosh's question."

cards:
  layer1:
    cue: "Okay so basically we are trying to classify the class of the images&hellip;"
    move: "Anything. So it doesn't matter, right? Your input can be image or it can be text or anything&hellip; a more interesting question is what advantage do you get by using Z instead of X?"
    foot: "Two exact lines &middot; two speakers &middot; consecutive turns"
  layer2:
    cue: "Narrows the idea to one use case to check understanding"
    move: "Widens it to any data, then asks why Z beats X"
  layer3:
    title: "A student wants a concrete case"
    text: "When an idea is abstract, students reach for one example to pin it down."
    foot: "Situation in {his} material &middot; &ldquo;student asks for concrete examples&rdquo;"
  layer4:
    title: "What the representation captures"
    text: "Prathosh keeps returning to the latent space: what Z learns about the data, and what that buys you over X."
    foot: "Recurring topic &middot; representation learning"
  layer5:
    title: "Show the why behind the how"
    text: "Get students reasoning about why a method works, not just how to call it."
    starts: "&ldquo;So we use Z to classify images?&rdquo;"
    moves_to: "&ldquo;Why is Z better than X?&rdquo;"
  layer6:
    quote: "The why behind the how. Keep pushing for the first principles."
    text: "The same idea runs through his posts: <em>&ldquo;we need to build AI Architects, not just model-users.&rdquo;</em>"

