# Prathosh A P, ML professor persona. Build with:
#   python build.py --users <lore>/users build prathosh
#
# Prathosh has two pages, switched from every screen (Lalith, 11 Nov 2026): this one (ML professor, IISc) and
# configs/prathosh-sanskrit.yaml (Sanskrit teacher). Both read users/prathosh; the Sanskrit sources (his recitations,
# his talk on the shastras and 22 LinkedIn posts on Sanskrit) are listed below and kept for the other page.
# Keep this exclude list identical to the include list in prathosh-sanskrit.yaml.

coach:
  slug: prathosh
  name: Prathosh
  full_name: Prathosh A P
  pronouns: [he, him, his]

# He's a professor, so the page says "teaching" where it would say "coaching".
words: {coaching: teaching, Coaching: Teaching, coaches: teaches}

session:
  file: "youtube/video/2024-11-23-Lec 10 - Deep Generative Models VAEs beta VAE VQ VAEs [QxcxTYZ62TI].md"
  kind: "YouTube · Deep Generative Models, Lecture 10"
  start: "Yes sir Sir uh so when you said Z tests"
  coach_speaker: speaker_1
  other: Student
  other_role: Student
  cue: 2
  move: 3
  frames:
    - ["question", "asking what he meant by using Z for classification"]
    - ["statement", "grounding it in a concrete case: train the classifier on a VAE's embeddings of MNIST, not on the images"]
    - ["statement", "narrowing the idea to one use case to check they have understood"]
    - ["reframe", "widening it to any kind of data, then asking the better question: why would Z beat X?"]
    - ["acknowledgment", "agreeing"]
    - ["request", "pointing back to the assignment: try it with a VAE, then compare against a classifier on the raw data"]
    - ["acknowledgment", "confirming the assignment"]
    - ["statement", "opening the assignment to check what he set"]

thread:
  situation: student-asks-for-concrete-examples
  topic: representation-learning
  phase: 1
  belief: 0

default_phase: 3
phases:
  - title: "Lay the mathematical foundations"
    keywords: [probability, likelihood, estimation, divergence, bayes, bayesian, expectation, theory, mathematical, mathematics, optimization, risk, gradient, linear, algebra, statistics, density, distribution, foundations, kernel, convex, entropy]
  - title: "Show the why behind the how"
    keywords: [intuition, representation, latent, embedding, embeddings, inference, variational, bound, lower, evidence, posterior, interpolation, space, reparameterization, understanding]
  - title: "Learn it by building it"
    keywords: [assignment, implementation, training, code, coding, experiment, quiz, exam, logistics, tutorial, grading, dataset, convergence, debugging, scheduling]
  - title: "From classic models to the frontier"
    keywords: [generative, adversarial, gan, gans, diffusion, vae, transformer, transformers, llm, llms, language, reinforcement, self, supervised, contrastive, distillation, neural, networks, recurrent, attention, models]
  - title: "Ask the questions that matter"
    keywords: [research, phd, career, curiosity, ethics, society, pedagogy, problem, impact, academia, science, education, mentorship, agentic, ai, future, students]

beliefs:
  - {title: "The why behind the how", text: "Students should see the philosophy behind the function, not just call it.", phases: [1, 0]}
  - {title: "First principles, no shortcuts", text: "Keep pushing for the first principles. The rigor is the reward.", phases: [0, 1]}
  - {title: "Architects, not model-users", text: "We need to build AI Architects, not just model-users.", phases: [3, 2]}
  - {title: "Try it, then compare", text: "Don't take a method on faith. Build it, run it and compare it with the alternative.", phases: [2]}
  - {title: "Curiosity comes first", text: "Observe things around you and ask questions about why something is the way it is.", phases: [4]}
  - {title: "Science should solve real problems", text: "If real problems can be solved using science and technology, then I should definitely do this.", phases: [4, 3]}

