  layer3: "A learner’s presentation isn’t landing, and their instinct is to polish the slides or rehearse more. In Albandery’s material this shows up as <em>a presentation going off plan</em>."
  layer4: "Albandery comes back to this in two posts within a week: on 30 August, and on 6 September, <em>&ldquo;Before you start improving the delivery or the slides, know exactly where your presentation loses its impact.&rdquo;</em> Estedama’s presentation course builds it in: its Presentation Impact Profile™ gives learners an initial picture of their current level before they develop their talk."
  layer5: "The purpose is practice that targets the real gap (the message or the impact), not the most visible symptom (the slides or the delivery)."
  layer6: "<em>Diagnose before you develop.</em> In her words: &ldquo;We can’t develop something we haven’t diagnosed correctly&rdquo; (translated from Arabic)."

