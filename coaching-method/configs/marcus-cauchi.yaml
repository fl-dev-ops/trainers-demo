beliefs:
  - {title: Ally, not accomplice, text: 'Our job is to be our customer’s ally, not their accomplice and not their adversary.', phases: [4, 2]}
  - {title: Facilitate buying, text: 'My job is never to convince. My job is to create the conditions so you convince yourself.', phases: [2, 4]}
  - {title: The buyer owns the objection, text: 'It’s not my job to overcome objections. The customer is the person best qualified to handle them.', phases: [3, 2]}
  - {title: Prospect for choice, text: 'Prospecting is the lifeblood of every business. Go after people who are a 100 percent fit.', phases: [0, 1]}
  - {title: Service, not servitude, text: 'The job of selling is service, not servitude. If the truth won’t sell it, don’t sell it.', phases: [4, 5]}
  - {title: Go to market is an organism, text: 'It is not a bunch of silos. Everyone in it has to work as one.', phases: [5]}

steps:
  collect: "We read {sources} long interviews with Marcus: two YouTube podcast episodes and one Sales Reinvented episode, <em>{words} words across {lines} lines.</em> We only use Marcus’s own answers, never the hosts’. From this collection, we follow one moment on the Systems Simplified podcast, where host Adi Klevit plays a buyer."
  layer1: "Adi plays the buyer and says <em>&ldquo;it's not in my budget right now.&rdquo;</em> In the very next turn, Marcus responds. These exact lines are the evidence for everything that follows."
  meaning: "The buyer pushes back on budget. Marcus doesn’t argue, discount or ‘handle’ it. He hands the objection back with a question the buyer has to answer honestly."
  cue: "The buyer says it isn’t in the budget. Marcus answers, <em>&ldquo;For most people it never is. Tell me something. If you were able to see the value in this, are you telling me that you couldn't find the budget from anywhere?&rdquo;</em>"
  layer2: "Marcus treats the objection as the buyer’s to solve, not his to overcome. He asks a question that tests whether the problem is money or value. The response stays linked to the exact exchange."
  layer3: "A buyer likes what they hear but says there’s no budget. In Marcus’s material this shows up as <em>client says it is not in the budget</em>."
  layer4: "Marcus comes back to budget objections with his CRAFTED model: budget is mostly about time, and most people confuse interest with intent, intent with commitment, and commitment with readiness."
  layer5: "The purpose is to move the buyer from &ldquo;there’s no budget&rdquo; to weighing the real cost of doing nothing, so they make the decision themselves."
  layer6: "<em>It’s not my job to overcome objections. The customer is the person best qualified to handle them.</em> This is the principle behind Marcus’s response."

cards:
  layer1:
    cue: But it's not &hellip; it's not in my budget right now.
    move: For most people it never is. I mean, tell me something. If you were able to see the value in this, are you telling me that you couldn't find the budget from anywhere?
    foot: Two exact lines &middot; two speakers &middot; consecutive turns
  layer2:
    cue: Plays a buyer who says there’s no budget
    move: Hands the objection back with a question about value
  layer3:
    title: The buyer says there’s no budget
    text: They like what they hear, but the money isn’t there right now.
    foot: Situation in {his} material &middot; &ldquo;client says it is not in the budget&rdquo;
  layer4:
    title: Budget is about time, not just money
    text: Marcus checks commitment, access, timing and who decides before he talks money. That is his CRAFTED model.
    foot: Recurring topic &middot; budget objections
  layer5:
    title: Hand the objection back
    text: Let the buyer weigh the cost of doing nothing and answer their own objection.
    starts: '&ldquo;It’s not in the budget&rdquo;'
    moves_to: '&ldquo;We could find it if it’s worth it&rdquo;'
  layer6:
    quote: It’s not my job to overcome objections. The customer is the person best qualified to handle them.
    text: 'The same idea runs through his interviews: <em>&ldquo;Our job is to be our customer''s ally, not their accomplice and not their adversary.&rdquo;</em>'

