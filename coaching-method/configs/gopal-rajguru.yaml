# Gopal RajGuru. Build with:
#   python build.py build gopal-rajguru
# Source: lore 6bacd5e9: 7 YouTube videos (keynotes, Beecon Elite masterclass, Nordic Business Forum talk, negotiation tips,
# and interviews with Oration Speakers 2020, Pod_Bacula 2024, NO FEAR 2011), 16 LinkedIn posts, innovateandgrow.com
# (his own posts plus company service pages).
# No coaching calls exist and no listener brings him a personal problem anywhere in his public content, and his interviews
# don't touch his core ideas, so the page follows a monologue (session.segments): the Beecon Elite masterclass
# "The Art and Science of Selling" (youtube.com/watch?v=1rrtbi7Qu7Q, about 30:50-32:50), where Gopal raises the salesperson's
# question himself ("why not just give them a discount?") and answers it. Ties to his twin's starter question and the
# procurement role play. Pronouns he/him: the interviewers say "he is the Managing Director" (Oration).

coach:
  slug: gopal-rajguru
  name: Gopal
  full_name: Gopal RajGuru
  pronouns: [he, him, his]

mobile: true

session:
  file: youtube/video/2021-12-16-the-art-and-science-of-selling-beecon-elite-1rrtbi7Qu7Q.md
  kind: YouTube · Beecon Elite masterclass
  start: Now who can help us in this process
  coach_speaker: speaker_1
  other: The question
  other_role: The question
  cue: 1
  move: 2
  # a talk is one long turn: it is split where each of these phrases begins, and the last part ends at `end`
  segments:
    - Now who can help us in this process
    - So why all of this work
    - Well my idea is any fool
    - So the question that begs
    - So how do you build trust Well
    - So what does C mean
    - And then the I this is intimacy
    - Now all of these 3 things
    - Remember the situation has changed
  end: How do you do this
  frames:
    - ["statement", "describing the coach inside the buying team who helps find the real decision makers"]
    - ["question", "raising the salesperson's question himself: why not skip the work and just give a discount?"]
    - ["reframe", "answering that anyone can sell cheap, selling high takes talent, and people buy from people they trust"]
    - ["question", "asking how you build trust, and calling it an emotion, not a fact"]
    - ["statement", "introducing his trust equation: credibility, reliability and intimacy over self-orientation"]
    - ["statement", "explaining credibility and reliability: know the customer's business and keep your promises"]
    - ["statement", "explaining intimacy: understand how the customer communicates and decides"]
    - ["statement", "warning that talking about your products and your company lowers trust"]
    - ["statement", "concluding that it's all about the customer, so reduce self-orientation"]

