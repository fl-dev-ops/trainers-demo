steps:
  collect: "We read {youtube} of his YouTube videos, including keynotes, a masterclass and three interviews, {linkedin} of his LinkedIn posts and {web} pages from his website: <em>{words} words across {lines} lines.</em> From this collection, we follow one masterclass. Gopal speaks alone here, so he raises the salesperson’s question himself, and then answers it."
  transcript: ["A recording becomes text", "His talk is transcribed word for word. At first, it is simply a record of what he said."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Gopal answered his own question."]
  speakers: ["Who said what", "This is a talk, so every line is Gopal’s. We mark the moment he puts the salesperson’s question into words, and the moment he answers it."]
  layer1: "Gopal raises the question every salesperson has asked: <em>&ldquo;So why not just give them a discount? Seems a lot easier, right?&rdquo;</em> In the very next line, he answers it himself. These exact lines are the evidence for everything that follows."
  meaning: "He has just described all the work of mapping the buying team. A discount looks like the easy way out. Gopal doesn’t take it: selling at a high price is the skill, and trust is how you do it."
  cue: "Asked why not just discount, Gopal answers, <em>&ldquo;Any fool can sell for the lowest price. It takes talent to sell for a high price.&rdquo;</em>"
  layer2: "He turns a price question into a trust question, then shows how to build trust with his trust equation. The response stays linked to the exact moment."
  layer3: "A salesperson under price pressure is tempted to discount instead of doing the work. In Gopal’s material this shows up as <em>difficult negotiations</em>."
  layer4: "Gopal keeps coming back to value over price: value comes up in 17 of his sources and negotiation in 12, across his talks and his team’s programmes."
  layer5: "The purpose is to move salespeople from &ldquo;just give them a discount&rdquo; to &ldquo;earn the price by building trust&rdquo;."
  layer6: "<em>People buy from the people they trust.</em> This is the principle behind Gopal’s answer."

cards:
  layer1:
    cue: So why not just give them a discount? Seems a lot easier, right?
    move: Any fool can sell for the lowest price. It takes talent to sell for a high price &hellip; people buy from the people they trust.
    foot: Two exact lines &middot; one speaker &middot; back to back
  layer2:
    cue: Raises the temptation to just give a discount
    move: Answers that the price is earned through trust, not cut
  layer3:
    title: Pressure to cut the price
    text: The buying team is complex and the deal is hard work, so a discount looks like the easy way to close.
    foot: Situation in {his} material &middot; &ldquo;difficult negotiations&rdquo;
  layer4:
    title: Value over price
    text: Gopal keeps coming back to selling on value and trading value for value, never on the lowest price.
    foot: Recurring pattern &middot; value in 17 sources, negotiation in 12
  layer5:
    title: Earn the price with trust
    text: Build credibility, reliability and intimacy, and talk less about yourself, so the customer pays for the value.
    starts: '&ldquo;Why not just give them a discount?&rdquo;'
    moves_to: '&ldquo;I earn my price by building trust&rdquo;'
  layer6:
    quote: People buy from the people they trust.
    text: 'The same idea runs through his work: <em>&ldquo;Companies don’t negotiate with companies. People negotiate with people.&rdquo;</em>'

