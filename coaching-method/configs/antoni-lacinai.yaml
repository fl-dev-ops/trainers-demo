  transcript: ["A recording becomes text", "The interview is transcribed word for word. At first, it is simply a record of who said what."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Antoni answered the host."]
  speakers: ["Who said what", "We separate the host’s questions from Antoni’s answers, and mark the problem she brings him."]
  layer1: "The host describes it: <em>&ldquo;We’ve had a really good offsite meeting, strategy, and then a couple of months later nothing really happened. What went wrong?&rdquo;</em> Antoni’s answer comes straight after. These exact lines are the evidence for everything that follows."
  meaning: "The leaders did the strategy work and expected change. Antoni doesn’t look at the strategy at all: he looks at whether people understood it and agreed with it, because only that changes behaviour."
  cue: "Asked what went wrong, Antoni answers, <em>&ldquo;Well, probably people didn’t get it. And if they got it, they might not still agree.&rdquo;</em>"
  layer2: "He moves the problem from the strategy to the communication, and from the plan to people’s behaviour. The response stays linked to the exact moment."
  layer3: "A leadership team has a good strategy that never turns into action. In Antoni’s material this shows up as <em>strategy not translating</em>."
  layer4: "Antoni keeps coming back to clarity: it comes up in 118 of his sources, and the clarity gap by name in 15, across his talks, interviews and posts."
  layer5: "The purpose is to move leaders from &ldquo;we told them the strategy&rdquo; to &ldquo;they understood it, agree with it and act on it&rdquo;."
  layer6: "<em>It’s a communication problem dressed in a strategy suit.</em> This is the principle behind Antoni’s answer."

cards:
  layer1:
    cue: We have a strategy, we’ve had a really good offsite meeting, strategy, and then a couple of months later nothing really happened. What went wrong?
    move: Well, probably people didn’t get it. And if they got it, they might not still agree &hellip; the only way to get a new result is to change behavior of everyone.
    foot: Two exact lines &middot; two speakers &middot; back to back
  layer2:
    cue: Brings a strategy that never turned into action
    move: Moves the problem from the strategy to understanding and behaviour
  layer3:
    title: The strategy that goes nowhere
    text: The offsite went well and the plan is good, but months later nobody is doing anything differently.
    foot: Situation in {his} material &middot; &ldquo;strategy not translating&rdquo;
  layer4:
    title: Close the clarity gap
    text: Antoni keeps coming back to the gap between what leaders mean and what their people understand.
    foot: Recurring pattern &middot; clarity in 118 sources, the clarity gap in 15
  layer5:
    title: Make it understood, then acted on
    text: Check that people get the message and agree with it, so their behaviour changes and the result follows.
    starts: '&ldquo;We told them the strategy&rdquo;'
    moves_to: '&ldquo;They get it, agree and act on it&rdquo;'
  layer6:
    quote: It’s a communication problem dressed in a strategy suit.
    text: 'The same idea runs through his work: <em>&ldquo;You can’t upskill your culture, but you can upskill your communication.&rdquo;</em>'

