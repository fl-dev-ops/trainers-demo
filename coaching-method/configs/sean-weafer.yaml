# Seán Weafer. Build with:
#   python build.py build sean-weafer
# Source: lore a826c017: 54 YouTube transcripts (his channel 2014-2026 plus guest shows, webinars and the
# Entrepreneurs Visiting Victor podcast), 182 LinkedIn posts since Nov 2024, 22 pages from salesmentor.pro and seanweafer.com.
# Exchange (Cathy's pick #1, chosen by Lalith 13 Nov 2026 over the MILE 2017 networking Q&A): "Sales Leadership Coaching
# Skills | Webinar for Executives" (2020 workshop, youtube.com/watch?v=ctdKHcRnDkw). At 47:08 a sales leader says
# salespeople have a "nebulous skill" to close deals that account managers don't, and nobody can define it; from 47:46
# Seán makes deal closing a competency the salesperson scores, then asks "What's not happening for you in deal closing
# that you want to happen?" and a chain of questions. This is his G2S (global to specific) coaching system in action.
# Other participants then help him name more competencies. Pronouns he/him: podcast hosts say "he's the creator of the
# G2S Coaching System".

