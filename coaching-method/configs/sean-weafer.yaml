steps:
  collect: "We read {youtube} of his YouTube videos, including talks, webinars, podcasts and interviews, {linkedin} of his LinkedIn posts and {web} pages from his two websites: <em>{words} words across {lines} lines.</em> From this collection, we follow one coaching workshop, where a sales leader brings him a problem his team can’t solve."
  transcript: ["A recording becomes text", "The workshop is transcribed word for word. At first, it is simply a record of who said what."]
  trace: ["One answer becomes a principle", "We can travel from the principle back through its purpose, recurring pattern and situation, all the way to the exact moment Seán answered the sales leader."]
  speakers: ["Who said what", "We separate the participants from Seán, and mark the problem the sales leader brings him."]
  layer1: "A sales leader describes it: <em>&ldquo;There was a kind of a very nebulous skill that salespeople had to close deals that account managers didn’t have… We kind of know it and we see it, but we couldn’t define it.&rdquo;</em> Seán’s answer comes straight after. These exact lines are the evidence for everything that follows."
  meaning: "The leader can see the difference in results but can’t name it, so he can’t coach it. Seán doesn’t try to define the magic. He turns it into a competency the salesperson scores, then coaches with questions."
  cue: "Asked how to define it, Seán answers, <em>&ldquo;If you get a low score, the question’s very simple: What’s not happening for you in deal closing that you want to happen?&rdquo;</em>"
  layer2: "He turns a vague feeling into something that can be measured, then breaks it down with a chain of questions, from rapport to <em>&ldquo;What are you afraid of?&rdquo;</em> The response stays linked to the exact moment."
  layer3: "A sales leader sees some people close deals and others not, but can’t say why. In Seán’s material this shows up as <em>a sales skill nobody can define</em>."
  layer4: "Seán keeps coming back to his G2S coaching system, global to specific, which he has used since 1997: it comes up by name in 14 of his sources, across his talks, webinars and websites."
  layer5: "The purpose is to move a leader from &ldquo;we know it when we see it&rdquo; to &ldquo;we can measure it, and we know what to work on&rdquo;."
  layer6: "<em>That which gets measured gets done.</em> This is the principle behind Seán’s answer."

cards:
