# Entrepreneurs Visiting Victor podcast), 182 LinkedIn posts since Nov 2024, 22 pages from salesmentor.pro and seanweafer.com.
# Exchange (Lalith's pick, 13 Nov 2026): MILE webinar "How Experts Become Influencers" (2017, youtube.com/watch?v=HCpOxau_Mqw,
# Q&A from about 45:36). The moderator reads an attendee's question: at a networking event, why not just be candid and
# share business cards? Seán answers that you'd be seen as intrusive and haven't qualified the person, then teaches
# "raise the pain and position the gain" with his accountant example. Ties to his twin's "what do I say when people ask
# what I do" post-it and the Niamh role play. Pronouns he/him: podcast hosts say "he's the creator of the G2S Coaching System".

