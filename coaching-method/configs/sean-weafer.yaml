    cue: There was a kind of a very nebulous skill that salespeople had to close deals that account managers didn’t have &hellip; We kind of know it and we see it, but we couldn’t define it.
    move: Well, if you look at deal closing, for example, would be a competency &hellip; if you get a low score, the question’s very simple. What’s not happening for you in deal closing that you want to happen?
    foot: Two exact lines &middot; two speakers &middot; back to back
  layer2:
    cue: Can see a skill but can’t define it
    move: Makes it a competency to score, then coaches with questions
  layer3:
    title: The skill nobody can define
    text: Some salespeople close deals and others don’t, and the leader can’t say what the difference is, so nobody can coach it.
    foot: Situation in {his} material &middot; &ldquo;a sales skill nobody can define&rdquo;
  layer4:
    title: Global to specific
    text: Seán keeps breaking a big goal into specific, measurable actions. It is his G2S coaching system, which he has used since 1997.
    foot: Recurring pattern &middot; G2S by name in 14 sources
  layer5:
    title: Make it measurable, then ask
    text: Have the person score the skill, check the score against their numbers, then ask what’s not happening that they want to happen.
    starts: '&ldquo;We know it when we see it&rdquo;'
    moves_to: '&ldquo;Here’s my score, and what I’ll work on&rdquo;'
  layer6:
    quote: That which gets measured gets done.
    text: 'The same idea runs through his work: <em>&ldquo;We look at the big global pictures that you want to address and then we break it down to the specifics.&rdquo;</em>'

