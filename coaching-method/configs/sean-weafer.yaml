  layer1: "An attendee asks: <em>&ldquo;Why not be candid and short and just share the business cards?&rdquo;</em> Seán’s answer comes straight after. These exact lines are the evidence for everything that follows."
  meaning: "The attendee wants to skip the small talk and get to business. Seán doesn’t agree: if you lead with your card, you haven’t found out whether the person is worth your time, and they haven’t seen any value in you."
  cue: "Asked why not just share business cards, Seán answers, <em>&ldquo;You haven’t qualified if that person is of value to you in the first place.&rdquo;</em>"
  layer2: "He turns a question about speed into a question about qualifying, then gives the exact words to use instead. The response stays linked to the exact moment."
  layer3: "Someone at a networking event wants to get straight to business without seeming fake. In Seán’s material this shows up as <em>attending a networking event</em>."
  layer4: "Seán keeps coming back to networking and raising the pain: networking comes up in 58 of his sources and pain in 26, across his talks, posts and websites."
  layer5: "The purpose is to move experts from &ldquo;here’s my card&rdquo; to &ldquo;a question that makes the right people say tell me more&rdquo;."
  layer6: "<em>Raise the pain, position the gain.</em> This is the principle behind Seán’s answer."

cards:
  layer1:
    cue: Why not be candid and short and just share the business cards?
    move: If you’re immediately just trying to sell your business, first of all you haven’t qualified if that person is of value to you in the first place &hellip; We call it raise the pain and position the gain.
    foot: Two exact lines &middot; two speakers &middot; back to back
  layer2:
    cue: Wants to skip to swapping business cards
    move: Shows how to qualify the person with a question about their pain
  layer3:
    title: First contact at a networking event
    text: The expert wants to get to business quickly, but leading with a title and a card makes people switch off.
    foot: Situation in {his} material &middot; &ldquo;attending a networking event&rdquo;
  layer4:
    title: Lead with their pain, not your title
    text: Seán keeps coming back to opening with the other person’s problem and earning the right to talk about yours.
    foot: Recurring pattern &middot; networking in 58 sources, pain in 26
  layer5:
    title: Qualify with one question
    text: Ask about the universal pain point, wait for the nod, then say how you solve it, so the right people ask to hear more.
    starts: '&ldquo;I’m an accountant, here’s my card&rdquo;'
    moves_to: '&ldquo;Do you know the way most small businesses&hellip;?&rdquo;'
  layer6:
    quote: Raise the pain, position the gain.
    text: 'The same idea runs through his work: <em>&ldquo;The key thing about networking is always about the other person. It’s not about you.&rdquo;</em>'

