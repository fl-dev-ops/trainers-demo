dos:
  - ["turn a vague skill into something you can measure", "Sales Leadership workshop · G2S in 14 sources"]
  - ["ask what's not happening that they want to happen", "Sales Leadership workshop · deal closing"]
  - ["open with the other person's pain, then position the gain", "MILE webinar · “raise the pain and position the gain”"]
