<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a Coach's Twin Learns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151310; --ink:#ece5d8; --dim:#a89e8c; --faint:#6f6759; --line:#37322a; --line2:#4a443a;
  --l1:#e2a93b; --l2:#4fa9a0; --l3:#d4746a; --l4:#9a86c9; --l5:#8fae62; --l6:#c94f33;
  --ease:cubic-bezier(.65,0,.25,1);
  --serif:'Fraunces',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--serif)}
body{cursor:pointer;user-select:none;-webkit-user-select:none}
body.final{cursor:grab}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
#stage *{pointer-events:none}
#stage .hit{pointer-events:auto}
svg#wires{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}

/* ---------- header & chapter rail */
header{position:absolute;left:60px;right:60px;top:34px;display:flex;align-items:center;justify-content:space-between;
  font:500 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
header b{color:var(--l1);font-weight:600}
#rail{display:flex;gap:28px}
#rail .ch{display:flex;flex-direction:column;gap:9px;align-items:flex-start;transition:color .5s}
#rail .ch.on{color:var(--ink)}
#rail .ch.done{color:var(--dim)}
#rail .dots{display:flex;gap:5px}
#rail .dots i{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:background .4s,transform .4s}
#rail .dots i.done{background:var(--dim)}
#rail .dots i.on{background:var(--l1);transform:scale(1.35)}
#hint{position:absolute;left:60px;bottom:34px;font:500 10.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);transition:opacity .6s}
#hint kbd{font:inherit;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:3px 6px;margin:0 2px}

/* ---------- narrative column */
#cap{position:absolute;left:60px;top:150px;width:390px;transition:opacity .45s}
#cap.out{opacity:0}
#cap .kick{font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--l1);margin-bottom:22px}
#cap h1{font-weight:380;font-size:38px;line-height:1.12;letter-spacing:-.01em;margin-bottom:22px;font-variation-settings:'opsz' 96}
#cap p{font-size:18px;line-height:1.55;color:var(--dim);font-weight:330}
#cap p em{color:var(--ink);font-style:italic}
#stat{position:absolute;left:60px;bottom:96px;width:390px;transition:opacity .5s}
#stat .num{font:300 64px/1 var(--serif);letter-spacing:-.02em;font-variation-settings:'opsz' 144;font-variant-numeric:tabular-nums}
#stat .unit{font:500 11px/1.6 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:12px}
#stat.hide{opacity:0}

/* hero */
#hero{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .8s,transform 1.1s var(--ease)}
#hero .kick{font:500 12px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--l1);margin-bottom:30px}
#hero h1{font-weight:320;font-size:88px;line-height:1.02;letter-spacing:-.025em;font-variation-settings:'opsz' 144}
#hero h1 i{color:var(--l1);font-weight:300}
#hero p{margin-top:30px;font-size:21px;line-height:1.55;color:var(--dim);max-width:640px;font-weight:330}
#hero .go{margin-top:46px;font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
#hero.out{opacity:0;transform:translateY(-30px) scale(.98)}

/* ---------- the window: Finder -> transcript */
#win{position:absolute;left:540px;top:120px;width:1000px;height:660px;border-radius:12px;background:#1d1c1b;
  border:1px solid #3a3835;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.04) inset;
  overflow:hidden;font-family:var(--sys);color:#e6e3de;
  transition:left 1s var(--ease),top 1s var(--ease),width 1s var(--ease),height 1s var(--ease),opacity .7s,transform 1.1s var(--ease);
  opacity:0;transform:translateY(40px) scale(.96)}
#win.show{opacity:1;transform:none}
#win.narrow{left:500px;top:96px;width:570px;height:772px}
#win.gone{opacity:0;transition:opacity .35s}
.tbar{height:46px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#2a2927;border-bottom:1px solid #3a3835}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.navb{color:#77736d;font-size:17px;letter-spacing:10px}
.wtitle{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views{display:flex;gap:2px;background:#353330;border-radius:6px;padding:2px}
.views i{width:28px;height:20px;border-radius:4px;display:block;position:relative}
.views i.on{background:#55524d}
.views i::after{content:'';position:absolute;left:9px;top:5px;width:10px;height:10px;border:1.5px solid #aaa49c;border-radius:2px}
.views i:nth-child(2)::after{border-width:1.5px 0;height:3px;top:5px;box-shadow:0 4px 0 0 #aaa49c}
.wbody{position:absolute;top:46px;bottom:26px;left:0;right:0;display:flex}
.side{width:190px;flex:none;background:#242321;border-right:1px solid #33312e;padding:14px 10px;font-size:12.5px;transition:width .9s var(--ease),padding .9s var(--ease),opacity .5s;overflow:hidden;white-space:nowrap}
.side h6{font-size:10.5px;font-weight:600;color:#7c7872;margin:6px 8px 6px}
.side div{padding:5px 8px;border-radius:6px;display:flex;align-items:center;gap:8px;color:#d8d4ce;transition:background .4s}
.side div.on{background:#3a3835}
.side .fi{width:15px;height:11px;border-radius:2px;background:#5da6ec;position:relative;flex:none}
.side .fi::before{content:'';position:absolute;left:0;top:-2px;width:6px;height:3px;border-radius:2px 2px 0 0;background:#5da6ec}
.pane{flex:1;position:relative;overflow:hidden}
.pane>section{position:absolute;inset:0;transition:opacity .6s,transform .8s var(--ease);opacity:0;transform:translateY(12px)}
.pane>section.on{opacity:1;transform:none}
.status{position:absolute;bottom:0;left:0;right:0;height:26px;border-top:1px solid #33312e;background:#242321;font-size:11px;color:#8b8780;display:flex;align-items:center;justify-content:center}

/* icon view */
.icons{display:flex;gap:70px;padding:120px 60px;justify-content:center}
.folder{width:150px;text-align:center;font-size:14px;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .6s,transform .7s var(--ease)}
.on .folder{opacity:1;transform:none}
.on .folder:nth-child(2){transition-delay:.15s}
.ficon{width:130px;height:100px;margin:0 auto 14px;position:relative}
.ficon::before{content:'';position:absolute;left:0;top:0;width:54px;height:18px;border-radius:8px 8px 0 0;background:#4b8fd6}
.ficon::after{content:'';position:absolute;left:0;top:10px;right:0;bottom:0;border-radius:5px 9px 9px 9px;background:linear-gradient(#78b8f5,#5a9ee6)}
.ficon i{position:absolute;z-index:1;left:50%;top:50px;transform:translateX(-50%)}
.folder small{display:block;color:#8b8780;font-size:12px;margin-top:5px}

/* list view */
.lhead,.lrow{display:grid;grid-template-columns:1fr 130px 110px 70px;gap:12px;padding:0 18px;align-items:center}
.lhead{height:30px;font-size:11px;font-weight:600;color:#8b8780;border-bottom:1px solid #33312e;background:#1d1c1b;position:relative;z-index:1}
.lrows{position:absolute;top:30px;left:0;right:0;will-change:transform}
.lrow{height:26px;font-size:12.5px;white-space:nowrap;transition:background .4s,color .4s}
.lrow:nth-child(even){background:#232220}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;display:flex;gap:9px;align-items:center}
.lrow .kd,.lrow .dt,.lrow .sz{color:#8b8780;font-size:11.5px}
.lrow .sz{text-align:right}
.badge{width:16px;height:12px;border-radius:3px;flex:none;position:relative;display:block}
.badge.yt{background:#e5443b}.badge.yt::after{content:'';position:absolute;left:6px;top:3px;border-left:5px solid #fff;border-top:3px solid transparent;border-bottom:3px solid transparent}
.badge.lm{background:#7a5af5}.badge.lm::after{content:'';position:absolute;left:4px;top:3px;width:6px;height:6px;border-radius:50%;border:1.5px solid #fff}
.ficon .badge{width:30px;height:22px;border-radius:5px}
.ficon .badge.yt::after{left:11px;top:6px;border-left-width:9px;border-top-width:5px;border-bottom-width:5px}
.ficon .badge.lm::after{left:8px;top:4px;width:11px;height:11px;border-width:2px}
.badge.li{background:#0a66c2}.badge.li::after{content:'in';position:absolute;left:3px;top:0;font:700 8px/12px var(--sys);color:#fff}
.badge.wb{background:#6c8a5a}.badge.wb::after{content:'';position:absolute;left:4px;top:2px;width:6px;height:6px;border-radius:50%;border:1.5px solid #fff}
.lrow.sel{background:#2f5fb3!important;color:#fff}
.lrow.sel .kd,.lrow.sel .dt,.lrow.sel .sz{color:#dfe8fa}

/* document view */
.doc{padding:16px 22px 16px 18px;font-size:13.5px;line-height:1.42}
.fm{font:12px/1.6 var(--mono);color:#8b8780;white-space:pre;overflow:hidden;max-height:120px;transition:max-height .9s var(--ease),opacity .6s,margin .9s var(--ease);margin-bottom:12px}
.doc.clean .fm{max-height:0;opacity:0;margin:0}
.ln{position:relative;padding:4px 8px 4px 8px;border-radius:7px;transition:background .5s,box-shadow .5s,opacity .5s;margin-bottom:2px}
.rh{font:12px/1.5 var(--mono);color:#9a958d;max-height:20px;overflow:hidden;transition:max-height .8s var(--ease),opacity .5s}
.rh .h{color:#6c6862}
.row{display:flex;gap:10px;align-items:baseline}
.ts{font:11px/1 var(--mono);color:#77736d;width:0;overflow:hidden;opacity:0;flex:none;transition:width .8s var(--ease),opacity .6s}
.who{font:600 10.5px/1 var(--sys);letter-spacing:.04em;text-transform:uppercase;width:0;overflow:hidden;opacity:0;flex:none;transition:width .8s var(--ease),opacity .6s;padding-top:1px}
.who.o{color:var(--l1)}.who{white-space:nowrap}.who.s{color:#9fb8d6}
.txt{flex:1;font:12.5px/1.5 var(--mono);color:#cfcac2}
.txt .c{display:none}.doc.clean .txt .r{display:none}.doc.clean .txt .c{display:inline}
.doc.clean .rh{max-height:0;opacity:0}
.doc.clean .ts{width:46px;opacity:1}
.doc.clean .who{width:54px;opacity:1}
.doc.clean .txt{font:13.4px/1.4 var(--sys);color:#ece8e2}
.doc.focus .ln{opacity:.32}
.doc.focus .ln.key{opacity:1;box-shadow:inset 0 0 0 1px rgba(226,169,59,.75);background:rgba(226,169,59,.1)}

/* ---------- right column panels */
.rpanel{position:absolute;left:1120px;top:110px;width:420px;opacity:0;transform:translateX(30px);transition:opacity .6s,transform .9s var(--ease)}
.rpanel.on{opacity:1;transform:none}
.plabel{font:500 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}

/* frames */
#frames{top:100px;height:760px}
#frames .plabel{position:absolute;top:-28px}
.fc{position:absolute;left:0;width:420px;padding:6px 11px 7px 12px;border-radius:8px;background:#1b211f;border:1px solid rgba(79,169,160,.35);
  font-size:12.8px;line-height:1.32;color:#dbeee9;font-weight:340;opacity:0;transform:translateX(24px);transition:opacity .5s,transform .7s var(--ease),border-color .5s,background .5s,box-shadow .5s}
.fc .k{display:inline;font:600 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--l2);margin-right:8px}
.fc .k em{font-style:normal;color:var(--l1);margin-left:8px}
#frames.on .fc{opacity:1;transform:none}
#frames.focus .fc{opacity:.25}
#frames.focus .fc.key{opacity:1;border-color:var(--l2);background:#1d2a27;box-shadow:0 0 30px rgba(79,169,160,.18)}
.wire{fill:none;stroke:var(--l2);stroke-width:1.2;opacity:0;transition:opacity .6s}
.wire.on{opacity:.45}
.wire.dim{opacity:.08}
.wire.key{opacity:.95;stroke-width:1.8}

/* layer cards */
#cards{top:150px}
.card{position:absolute;left:0;top:0;width:420px;padding:22px 24px 22px;border-radius:12px;background:rgba(32,29,24,.94);border:1px solid var(--line2);
  opacity:0;transform:translateY(16px);transition:opacity .55s,transform .8s var(--ease);backdrop-filter:blur(6px)}
.card.on{opacity:1;transform:none;transition-delay:.35s}
.card .lv{font:600 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
.card h3{font-weight:400;font-size:23px;line-height:1.22;margin-bottom:12px;font-variation-settings:'opsz' 72}
.card p{font-size:15px;line-height:1.5;color:var(--dim);font-weight:330}
.card .pair{display:grid;grid-template-columns:62px 1fr;gap:10px 12px;margin-top:6px}
.card .pair dt{font:600 9.5px/1.9 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.card .pair dd{font-size:15px;line-height:1.45;color:var(--ink);font-weight:340}
.card .pair dd.q{font-style:italic}
.card .foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font:500 10px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.card blockquote{font-size:20px;line-height:1.38;font-weight:360;color:var(--ink);margin:4px 0 14px;font-style:italic}

/* finale legend */
#legend{top:170px;left:1270px;width:290px}
.lg{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateX(14px);transition:opacity .5s,transform .7s var(--ease)}
#legend.on .lg{opacity:1;transform:none}
.lg i{width:9px;height:9px;border-radius:50%;display:block;transform:translateY(-1px)}
.lg span{font:500 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.lg b{font:300 26px/1 var(--serif);font-variant-numeric:tabular-nums}
#tip{position:fixed;max-width:360px;padding:9px 12px;border-radius:8px;background:rgba(21,19,16,.95);border:1px solid var(--line2);font-size:14px;line-height:1.4;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .15s;z-index:5}
#tip small{display:block;font:600 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
/* ---------- findings: a docs page, one layer per page */
#fd{position:absolute;left:60px;right:60px;top:96px;bottom:34px;display:grid;grid-template-columns:280px 1fr;gap:56px;
  opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .6s,transform .9s var(--ease),visibility 0s .6s;cursor:default}
#fd.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s .2s,transform .9s var(--ease) .2s,visibility 0s}
#stage #fd,#stage #fd *{pointer-events:auto}
#fd .kick{font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--l1);margin:24px 0 20px}
#fd .lead h1{font-weight:380;font-size:32px;line-height:1.14;margin-bottom:16px;font-variation-settings:'opsz' 96}
#fd .lead p{font-size:15px;line-height:1.55;color:var(--dim);font-weight:330}
#fd nav{margin-top:30px;border-top:1px solid var(--line)}
#fd nav a{display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line);
  cursor:pointer;color:var(--dim);transition:background .3s,color .3s}
#fd nav a:hover{background:rgba(255,255,255,.03);color:var(--ink)}
#fd nav a.on{background:rgba(255,255,255,.05);color:var(--ink)}
#fd nav a i{width:9px;height:9px;border-radius:50%}
#fd nav a span{font:500 11px/1.35 var(--mono);letter-spacing:.14em;text-transform:uppercase}
#fd nav a b{font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 7px;border-radius:4px;border:1px solid currentColor;opacity:.85}
#fd .keys{margin-top:18px;font:500 10px/1.6 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
#fd .page{overflow-y:auto;padding:24px 36px 40px 0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#fd article{display:none;max-width:920px}
#fd article.on{display:block;animation:fdin .5s var(--ease)}
@keyframes fdin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#fd .lv{font:600 10.5px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:16px}
#fd h2{font-weight:380;font-size:40px;line-height:1.1;margin-bottom:14px;font-variation-settings:'opsz' 120;display:flex;align-items:center;gap:18px}
#fd h2 b{font:600 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:7px 10px;border-radius:5px;border:1px solid currentColor}
#fd .what{font-size:19px;line-height:1.5;color:var(--dim);font-weight:330;max-width:760px}
#fd .what em{color:var(--ink)}
#fd .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 8px}
#fd .nums div{border-top:1px solid var(--line2);padding-top:14px}
#fd .nums strong{display:block;font:300 40px/1 var(--serif);font-variant-numeric:tabular-nums;font-variation-settings:'opsz' 144}
#fd .nums small{display:block;margin-top:10px;font:500 10px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#fd h4{font:600 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin:38px 0 14px}
#fd .how{font-size:16px;line-height:1.6;color:var(--ink);font-weight:340;max-width:800px}
#fd .how code,#fd li code,#fd .ex code{font:12.5px var(--mono);color:var(--l1);background:rgba(226,169,59,.08);padding:1px 5px;border-radius:4px}
#fd .exs{display:grid;gap:12px}
#fd .ex{padding:16px 18px;border-radius:10px;background:rgba(32,29,24,.9);border:1px solid var(--line2);border-left-width:3px}
#fd .ex.good{border-left-color:var(--l5)}#fd .ex.bad{border-left-color:var(--l6)}
#fd .ex .tag{font:600 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px}
#fd .ex.good .tag{color:var(--l5)}#fd .ex.bad .tag{color:#e0715a}
#fd .ex q{display:block;font-size:17px;line-height:1.42;font-style:italic;color:var(--ink);font-weight:350;quotes:'“' '”'}
#fd .ex p{margin-top:9px;font-size:14px;line-height:1.5;color:var(--dim);font-weight:330}
#fd .ex p q{display:inline;font-size:14px;color:#d8d0c2}
#fd ul{list-style:none;display:grid;gap:10px;max-width:820px}
#fd li{position:relative;padding-left:22px;font-size:16px;line-height:1.5;color:var(--ink);font-weight:340}
#fd li::before{content:'';position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:50%;background:#e0715a}
#fd li strong{font-weight:560}
#fd .todo{margin-top:34px;padding:18px 20px;border-radius:10px;border:1px dashed var(--line2);font-size:16px;line-height:1.55;color:var(--ink);font-weight:340}
#ab{position:absolute;left:60px;right:60px;top:96px;bottom:34px;display:grid;grid-template-columns:280px 1fr;gap:56px;
  opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .6s,transform .9s var(--ease),visibility 0s .6s;cursor:default}
#ab.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s .2s,transform .9s var(--ease) .2s,visibility 0s}
#stage #ab,#stage #ab *{pointer-events:auto}
#ab .kick{font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--l1);margin:24px 0 20px}
#ab .lead h1{font-weight:380;font-size:32px;line-height:1.14;margin-bottom:16px;font-variation-settings:'opsz' 96}
#ab .lead p{font-size:15px;line-height:1.55;color:var(--dim);font-weight:330}
#ab .found{margin-top:26px;border-top:1px solid var(--line)}
#ab .found div{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}

ot noisy?"},{"id":"t0026","ts":"¶6","raw":"speaker_2","coach":false,"who":"Ivana","text":"Oh, well, they would— many times they would— I would feel frozen by and overwhelmed by that emotion in the moment."},{"id":"t0028","ts":"¶7","raw":"speaker_1","coach":true,"who":"Bevan","text":"Yeah."},{"id":"t0030","ts":"¶8","raw":"speaker_2","coach":false,"who":"Ivana","text":"And the worst thing is that it would happen— obviously there was a pattern to it, but it would happen in public, in groups of people, Where there's, you know, comparison between what I do, what other people do, how, how much more …"},{"id":"t0032","ts":"¶9","raw":"speaker_1","coach":true,"who":"Bevan","text":"Yeah, that's so, um, such a normal way, but so many people feel a similar freeze when their gremlins show up. So what was the coaching experience like for you?"}]},"frames":[{"id":"f-00","span":"asking why she came to coaching","kind":"question","from":["t0020"]},{"id":"f-01","span":"naming the gremlins that make her feel small and not worthy","kind":"statement","from":["t0022"]},{"id":"f-02","span":"slowing it down: how did the gremlins make her feel when they got noisy?","kind":"question","from":["t0024"]},{"id":"f-03","span":"describing feeling frozen and overwhelmed in the moment","kind":"statement","from":["t0026"]},{"id":"f-04","span":"letting her keep going","kind":"acknowledgment","from":["t0028"]},{"id":"f-05","span":"noticing the pattern: it happens in groups, when she compares herself","kind":"statement","from":["t0030"]},{"id":"f-06","span":"telling her the freeze is normal, and that many people feel it when their gremlins show up","kind":"reframe","from":["t0032"]}],"thread":{"cue":"f-01","move":"f-02","cueLine":"t0022","moveLine":"t0024"},"labels":{"tactics":["feeling small and unworthy","fostering team responsibility and autonomy","personal issues seeping into business","overwhelmed by long-term life purpose questions","managing triggers and frustration","fear of judgment when postin <script>

</article>`;

/* ================= the layered space ================= */
const FLOOR = {1: 1.0, 2: .84, 3: .68, 4: .52, 5: .36, 6: .2}, FY = l => -1 + (l - 1) * .4;
const counts = {}, off = {}; let NN = 0;
for (let l = 1; l <= 6; l++) { counts[l] = S.floors[l].length / 2; off[l] = NN; NN += counts[l]; }
const X = new Float32Array(NN), Y = new Float32Array(NN), Z = new Float32Array(NN), LAY = new Uint8Array(NN);
for (let l = 1; l <= 6; l++) {
  const f = S.floors[l], w = FLOOR[l];
  for (let k = 0; k < counts[l]; k++) { const i = off[l] + k; X[i] = f[2 * k] / 1000 * w; Z[i] = f[2 * k + 1] / 1000 * w; Y[i] = FY(l); LAY[i] = l; }

const ORDER = {};
for (let l = 1; l <= 6; l++) {
  const a = new Uint32Array(counts[l]); for (let k = 0; k < a.length; k++) a[k] = off[l] + k;
  for (let k = a.length - 1; k > 0; k--) { const j = (Math.random() * (k + 1)) | 0; const t = a[k]; a[k] = a[j]; a[j] = t; }
  ORDER[l] = a;
}
const EDGE = {};                               // links grouped by the upper layer they reach
for (let k = 0; k < S.edges.length; k += 2) { const a = S.edges[k], b = S.edges[k + 1], l = LAY[b]; (EDGE[l] ||= []).push(a, b); }

const PX = new Float32Array(NN), PYs = new Float32Array(NN);
const LBL = i => { const l = LAY[i], k = i - off[l]; return l === 3 ? S.labels.tactics[k] : l === 4 ? S.labels.scenes[k] : l === 5 ? S.labels.phases[k] : l === 6 ? S.labels.beliefs[k] : ''; };

/* ================= animated values ================= */
const V = {}, TG = {};
const val = (k, v) => { V[k] = TG[k] = v; };
[['ry', .55], ['rx', .62], ['zoom', .82], ['ty', -1], ['cx', 790], ['cy', 520], ['spin', 0], ['thrA', 0]].forEach(([k, v]) => val(k, v));
for (let l = 1; l <= 6; l++) { val('L' + l, 0); val('E' + l, 0); }
let rot = 0, drag = 0, cur = -1, thrUpTo = 0, cardLevel = 0, fly = null, flyF = null, wiresLeft = 0;

/* ================= layout ================= */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, KS = 1, OX = 0, OY = 0, KD = 1, M = false;

const HINT = $('#hint').innerHTML;

function fit() {

  M = !!CF.mobile && MQ.matches;

  $('#hint').innerHTML = M ? '<span id="mback" class="hit">← Back</span><span>Tap to continue</span>' : HINT;
  $('#go').textContent = M ? 'Tap to begin →' : 'Click to begin →';
  if (M) { camM(0); wiresLeft = 0; return; }
  KS = Math.min(W / 1600, H / 900); KD = KS; OX = (W - 1600 * KS) / 2; OY = (H - 900 * KS) / 2;

}

function camM(dt) {
  const v = $('#vis').getBoundingClientRect(), panel = ['#cards', '#legend'].map(s => $(s)).find(el => el.classList.contains('on'));
  const top = v.top + 6, bottom = panel ? panel.getBoundingClientRect().top - 10 : v.bottom - 6, h = Math.max(120, bottom - top);
  const ks = Math.min(W / 860, h / 560), ox = W / 2 - 800 * ks, oy = top + h / 2 - 470 * ks;

}

/* ================= state application ================= */
const cls = (sel, c, on) => $(sel).classList.toggle(c, !!on);
// camera per layer: start low and close on the dense floors, rise with each layer, end on the whole
const CAM = {1: [.62, .82, -1.0, 790, 520], 2: [.44, .8, -.78, 790, 530], 3: [.4, .78, -.52, 790, 520], 4: [.37, .76, -.28, 790, 505],
             5: [.4, .76, -.05, 790, 490], 6: [.44, .74, .12, 790, 470], 7: [.5, .7, 0, 840, 470]};
function go(i) {
  i = Math.max(0, Math.min(N - 1, i)); if (i === cur) return;
  const prev = cur; cur = i; const st = STATES[i], now = performance.now();
  // the lines drop from the transcript onto the floor

  }, 380);
  if (st.stat) { countTo(st.stat[0]); $('#unit').textContent = st.stat[1]; }
  cls('#stat', 'hide', !st.stat);
  $('#hint').style.opacity = i === N - 1 ? 0 : 1;
  document.body.classList.toggle('final', st.lvl === 7);
  cls('#fd', 'on', st.fd);
  cls('#ab', 'on', st.ab);
  document.querySelectorAll('#rail .ch').forEach((el, c) => { el.classList.toggle('on', c === st.ch); el.classList.toggle('done', c < st.ch); });
  document.querySelectorAll('#rail i').forEach(el => { const k = +el.dataset.i; el.classList.toggle('on', k === i); el.classList.toggle('done', k < i); });

  // ----- the window
  const win = $('#win');
  const shown = i >= 1 && i < ST_L1 || i === ST_FR || i === ST_CUE;
  win.classList.toggle('show', shown);
  win.classList.toggle('gone', !shown && i > 0);
  win.classList.toggle('narrow', i === ST_FR || i === ST_CUE);
  $('#side').style.cssText = i <= 1 ? '' : 'width:0;padding:14px 0;opacity:0';
  cls('#list', 'on', i === 1); cls('#docs', 'on', i >= 2);
  $('#wtitle').textContent = i <= 1 ? CF.coach.slug : `${sess.date} · ${sess.title}.md`;
  $('#status').textContent = i >= 2 ? `${sess.kind} · ${day(sess.date)}` : '';
  if (i === 1) runList(); else listAnim++;
  const doc = $('#doc');
  doc.classList.toggle('clean', i >= 3); doc.classList.toggle('focus', i === ST_CUE);

  // ----- right panels
  cls('#frames', 'on', i === ST_FR || i === ST_CUE); cls('#frames', 'focus', i === ST_CUE);
  for (let l = 1; l <= 6; l++) cls('#c' + l, 'on', st.lvl === l);
  cls('#cards', 'on', st.lvl >= 1 && st.lvl <= 6);
  cls('#legend', 'on', st.lvl === 7);
  wiresLeft = 100;

  // ----- canvas targets
  const lv = st.lvl || 0, t = TG;
  for (let l = 1; l <= 6; l++) { t['L' + l] = lv && l <= lv ? 1 : 0; t['E' + l] = lv && l <= lv && l > 1 ? 1 : 0; }
  t.thrA = lv ? 1 : 0; thrUpTo = Math.min(lv, 6); cardLevel = lv >= 1 && lv <= 6 ? lv : 0;
  t.spin = lv === 7 ? .07 : lv ? .02 : 0;
  if (lv) { const [rx, zoom, ty, cx, cy] = CAM[lv]; Object.assign(t, {rx, zoom, ty, cx, cy}); }
}

let numCur = 0, numAnim = 0;
function countTo(v) {
  const from = numCur, t0 = performance.now(), id = ++numAnim;
  const tick = now => {
    if (id !== numAnim) return;
    const p = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - p, 3);
    numCur = Math.round(from + (v - from) * e); $('#num').textContent = fmt(numCur);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* the list scrolls through every source, then selects our session */
let listAnim = 0;
function runList() {
  const rows = $('#lrows'), id = ++listAnim, t0 = performance.now();
  rows.querySelectorAll('.sel').forEach(r => r.classList.remove('sel'));
  const target = Math.max(0, Math.min(selIdx * 26 - 300, files.length * 26 - 556)), dur = 3600;
  rows.style.transform = 'translateY(0)';
  const tick = now => {
    if (id !== listAnim || cur !== 1) return;
    const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    rows.style.transform = `translateY(${-e * target}px)`;
    if (p < 1) requestAnimationFrame(tick);
    else setTimeout(() => id === listAnim && rows.children[selIdx].classList.add('sel'), 250);
  };
  requestAnimationFrame(tick);
}

/* wires: transcript lines -> frame cards */
function wires() {
  const svg = $('#wires'), fr = $('#frames'), on = cur === ST_FR || cur === ST_CUE;
  const lineBox = {};
  document.querySelectorAll('.ln').forEach(el => { const r = el.getBoundingClientRect(); lineBox[el.dataset.id] = ((r.top + r.bottom) / 2 - OY) / KS; });
  const cards = [...fr.querySelectorAll('.fc')], frTop = 100;
  let y = 0;
  const pos = cards.map((el, k) => {
    const h = el.offsetHeight || 54, a = lineBox[S.frames[k].from.at(-1)];
    const want = a !== undefined ? a - frTop - h / 2 : y;
    y = Math.max(want, y); const top = y; y += h + 6; return {top, h};
  });
  const over = y - 765;
  if (over > 0) pos.forEach((p, k) => p.top -= over * k / Math.max(1, pos.length - 1));
  cards.forEach((el, k) => { el.style.top = pos[k].top + 'px'; el.style.transitionDelay = (on && cur === ST_FR ? .25 + k * .1 : 0) + 's'; });
  if (!svg.childElementCount) S.frames.forEach(f => f.from.forEach(() => svg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'))));
  let n = 0;
  cards.forEach((el, k) => {
    const f = S.frames[k], key = f.id === TH.cue || f.id === TH.move, ty = frTop + pos[k].top + pos[k].h / 2, tx = 1120;
    f.from.forEach(id => {
      const p = svg.children[n++], a = lineBox[id]; if (a === undefined) return;
      const x0 = 1072, mx = (x0 + tx) / 2;
      p.setAttribute('d', `M${x0},${a} C${mx},${a} ${mx},${ty} ${tx},${ty}`);
      p.setAttribute('class', `wire${on ? ' on' : ''}${cur === ST_CUE ? (key ? ' key' : ' dim') : ''}`);
      p.style.transitionDelay = (on && cur === ST_FR ? .35 + k * .1 : 0) + 's';
    });
  });
}

/* ================= canvas ================= */
function project(x, y, z, out) {
  const ry = rot + V.ry + drag, rx = V.rx, s = KS * 380 * V.zoom;
  y -= V.ty;
  const cy = Math.cos(ry), sy_ = Math.sin(ry), cx = Math.cos(rx), sx_ = Math.sin(rx);
  const x1 = x * cy + z * sy_, z1 = -x * sy_ + z * cy;
  const y2 = y * cx - z1 * sx_, z2 = y * sx_ + z1 * cx;
  const p = 3.4 / (3.4 + z2);
  out[0] = sx(V.cx) + x1 * p * s; out[1] = sy(V.cy) - y2 * p * s;
  return out;
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const pt = [0, 0];
const DOT = {1: 1.1, 2: 1.3, 3: 2.3, 4: 4, 5: 5.4, 6: 6};
const ALPHA = {1: .5, 2: .55, 3: .8, 4: .9, 5: .9, 6: .95};

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const k in TG) {
    const rate = k[0] === 'L' ? 1.1 : k[0] === 'E' ? 1.4 : 2.6;
    V[k] += (TG[k] - V[k]) * (1 - Math.exp(-dt * rate));
  }
  rot += dt * V.spin;
  if (M) camM(dt);
  else if (wiresLeft > 0) { wiresLeft--; wires(); }
  ctx.clearRect(0, 0, W, H);
  if ([1, 2, 3, 4, 5, 6].some(l => V['L' + l] > .005)) drawLayers(now);
  requestAnimationFrame(frame);
}

function drawLayers(now) {
  for (let l = 1; l <= 6; l++) {
    if (V['L' + l] < .005) continue;
    for (let i = off[l], e = off[l] + counts[l]; i < e; i++) { project(X[i], Y[i], Z[i], pt); PX[i] = pt[0]; PYs[i] = pt[1]; }
  }
  // floors
  for (let l = 1; l <= 6; l++) {
    const a = Math.min(1, V['L' + l] * 1.5); if (a < .01) continue;
    const w = FLOOR[l], y = FY(l), cs = [[-w, -w], [w, -w], [w, w], [-w, w]].map(([x, z]) => project(x, y, z, [0, 0]));
    ctx.beginPath(); cs.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
    ctx.fillStyle = rgba(C[l], .04 * a); ctx.fill(); ctx.strokeStyle = rgba(C[l], .28 * a); ctx.lineWidth = 1; ctx.stroke();
    const right = cs.reduce((m, p) => p[0] > m[0] ? p : m);
    ctx.fillStyle = rgba(C[l], .9 * a); ctx.font = `600 ${M ? 9 : 10.5 * KS}px 'IBM Plex Mono',monospace`;
    const lbl = `L${l} · ${NAMES[l].toUpperCase()}`, lx = right[0] + 12 * KD;
    ctx.fillText(lbl, M ? Math.min(lx, W - 4 - ctx.measureText(lbl).width) : lx, right[1] + 4 * KD);
  }
  // links up into each layer, one path per layer
  for (let l = 2; l <= 6; l++) {
    const a = V['E' + l] * Math.min(V['L' + l], V['L' + (l - 1)]); if (a < .01 || !EDGE[l]) continue;
    const E = EDGE[l], n = Math.floor(E.length / 2 * Math.min(1, a * 1.2));
    ctx.strokeStyle = rgba(C[l], (l >= 5 ? .2 : l === 4 ? .13 : .07) * a); ctx.lineWidth = l >= 4 ? .8 : .5;
    ctx.beginPath();
    for (let k = 0; k < n; k++) { const p = E[2 * k], q = E[2 * k + 1]; ctx.moveTo(PX[p], PYs[p]); ctx.lineTo(PX[q], PYs[q]); }
    ctx.stroke();
  }
  // atoms: each floor fills in as it appears
  for (let l = 1; l <= 6; l++) {
    const v = V['L' + l]; if (v < .005) continue;
    const ord = ORDER[l], n = Math.floor(ord.length * Math.min(1, v * 1.15)), r = DOT[l] * KD;
    ctx.fillStyle = rgba(C[l], ALPHA[l] * (cardLevel && cardLevel - l >= 2 ? .45 : 1));
    if (l <= 3) for (let k = 0; k < n; k++) { const i = ord[k]; ctx.fillRect(PX[i] - r / 2, PYs[i] - r / 2, r, r); }
    else {
      ctx.strokeStyle = rgba(C[l], .3);
      for (let k = 0; k < n; k++) {
        const i = ord[k]; ctx.beginPath(); ctx.arc(PX[i], PYs[i], r, 0, 6.283); ctx.fill();
        ctx.beginPath(); ctx.arc(PX[i], PYs[i], r + 3 * KD, 0, 6.283); ctx.stroke();
      }
    }
  }
  drawSession(now);
  drawThread(now);
}

// the session's lines (and their frames) stay lit, so the eye can follow them
function drawSession(now) {
  const a1 = V.L1; if (a1 < .01) return;
  SN.forEach((i, k) => {
    let x = PX[i], y = PYs[i];
    if (fly) {
      const p = ease((now - fly.t0 - k * 55) / 1500), f = fly.from[k];
      if (p < 1) {
        x = f[0] + (x - f[0]) * p; y = f[1] + (y - f[1]) * p;
        const w = f[2] + (5 * KD - f[2]) * p, h = f[3] + (5 * KD - f[3]) * p;
        ctx.fillStyle = rgba(C[1], .16 + .5 * p); ctx.strokeStyle = rgba(C[1], .8); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, Math.min(7, h / 2)); ctx.fill(); ctx.stroke();
        return;
      }
    }
    ctx.fillStyle = rgba('#f6d48a', a1); ctx.beginPath(); ctx.arc(x, y, 2.6 * KD, 0, 6.283); ctx.fill();
  });
  if (V.L2 < .01) return;
  SF.forEach((f, k) => {
    let x = PX[f.node], y = PYs[f.node];
    if (flyF) {
      const p = ease((now - flyF.t0 - k * 55) / 1500), r = flyF.from[k];
      if (p < 1) {
        x = r[0] + (x - r[0]) * p; y = r[1] + (y - r[1]) * p;
        const w = r[2] + (5 * KD - r[2]) * p, h = r[3] + (5 * KD - r[3]) * p;
        ctx.fillStyle = rgba(C[2], .16 + .5 * p); ctx.strokeStyle = rgba(C[2], .85); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, Math.min(8, h / 2)); ctx.fill(); ctx.stroke();
        return;
      }
    }
    ctx.strokeStyle = rgba(C[2], .6 * V.L2); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(PX[f.from], PYs[f.from]); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = rgba('#9fe3da', V.L2); ctx.beginPath(); ctx.arc(x, y, 2.6 * KD, 0, 6.283); ctx.fill();
  });
}

function drawThread(now) {
  if (V.thrA < .02) return;
  const pulse = .75 + .25 * Math.sin(now / 420), flying = (fly && now - fly.t0 < 2300) || (flyF && now - flyF.t0 < 2300);
  ctx.lineWidth = 2 * KD;
  for (const [a, b] of thrEdges) {
    const lb = LAY[b]; if (lb > thrUpTo) continue;
    const al = Math.min(V['L' + LAY[a]], V['L' + lb]) * V.thrA * (flyF && lb >= 2 ? ease((now - flyF.t0 - 1500) / 700) : 1);
    ctx.strokeStyle = rgba('#f3ead9', .85 * al);
    ctx.beginPath(); ctx.moveTo(PX[a], PYs[a]); ctx.lineTo(PX[b], PYs[b]); ctx.stroke();
  }
  for (const i of thr) {
    const l = LAY[i]; if (l > thrUpTo || (flying && l === thrUpTo)) continue;
    const al = V['L' + l] * V.thrA, big = l >= 4;
    ctx.fillStyle = rgba(C[l], al); ctx.beginPath(); ctx.arc(PX[i], PYs[i], (big ? 7 : 4.5) * KD, 0, 6.283); ctx.fill();
    ctx.strokeStyle = rgba('#f3ead9', .95 * al); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(PX[i], PYs[i], (big ? 11 : 9) * KD * pulse, 0, 6.283); ctx.stroke();
  }
  // leaders from this layer's thread atoms to its card
  if (cardLevel && !flying) {
    const r = $('#c' + cardLevel).getBoundingClientRect();
    ctx.strokeStyle = rgba(C[cardLevel], .75 * V.thrA); ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    thr.filter(i => LAY[i] === cardLevel).forEach((i, k) => {
      ctx.beginPath(); ctx.moveTo(PX[i] + (M ? 0 : 10 * KS), PYs[i] + (M ? 10 * KD : 0));
      if (M) ctx.lineTo(r.left + r.width * (.3 + k * .4), r.top - 6); else ctx.lineTo(r.left - 8, r.top + (cardLevel <= 2 ? 56 + k * 74 : 26) * KS);
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }
}

/* ================= input ================= */
let down = null, moved = false;
addEventListener('pointerdown', e => { down = {x: e.clientX, d: drag}; moved = false; });
addEventListener('pointermove', e => {
  if (down && Math.abs(e.clientX - down.x) > 5 && STATES[cur].lvl) { moved = true; drag = down.d + (e.clientX - down.x) * .006; }
  hover(e);
});
addEventListener('pointerup', e => {
  const was = down; down = null;
  if (!was || moved) return;
  const dot = e.target.closest && e.target.closest('#rail i');
  if (dot) { go(+dot.dataset.i); return; }
  if (e.target.closest && e.target.closest('#mback, #fd .keys')) { go(cur - 1); return; }
  const ptab = e.target.closest && e.target.closest('#fd .ptab');
  if (ptab) { showPersona(+ptab.dataset.p); return; }
  const chip = e.target.closest && e.target.closest('#ab .chip');
  if (chip) { chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true')); return; }
  if (STATES[cur].fd) return;                  // reading the last page: clicks do not advance
  go(cur + 1);
});
addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (['ArrowLeft', 'Backspace', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  if (e.key === 'Home') go(0);
});
const tip = $('#tip');
function hover(e) {
  if (M || STATES[cur].lvl !== 7 || down) { tip.style.opacity = 0; return; }
  let best = -1, bd = 12 * 12;
  for (let i = off[3]; i < NN; i++) { const dx = PX[i] - e.clientX, dy = PYs[i] - e.clientY, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  if (best < 0) { tip.style.opacity = 0; return; }
  const l = LAY[best];
  tip.innerHTML = `<small style="color:${C[l]}">L${l} · ${NAMES[l]}</small>${esc(LBL(best))}`;
  tip.style.left = Math.min(W - 380, e.clientX + 16) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; tip.style.opacity = 1;
}
addEventListener('resize', fit);
MQ.addEventListener && MQ.addEventListener('change', fit);
fit(); requestAnimationFrame(fit);
go(+location.hash.slice(1) || 0);
addEventListener('hashchange', () => go(+location.hash.slice(1) || 0));
requestAnimationFrame(frame);
if (document.fonts) document.fonts.ready.then(() => { wiresLeft = 30; });
})();
</script>
</body>
